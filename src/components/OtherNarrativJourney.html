<!-- TRANSITION ENGINE CONTROLLER SCRIPT -->
<script>
    function initJourneyTransition(triggerButtonId, destinationSectionId) {
        const triggerBtn = document.getElementById(triggerButtonId);
        const overlay = document.getElementById('journey-overlay');
        const bgVideoContainer = document.getElementById('bg-video-container');
        const activeTrack = document.getElementById('track-active');
        const activeTies = document.getElementById('track-ties-active');
        const trackHighlight = document.getElementById('track-rail-highlight');
        const trackPath = document.getElementById('track-ballast');
        const trainGroup = document.getElementById('train-group');
        const trainSmoke = document.getElementById('train-smoke');
        const chapterBox = document.getElementById('chapter-box');
        const chapterNum = document.getElementById('chapter-num');
        const chapterTitle = document.getElementById('chapter-title');
        const progressBar = document.getElementById('journey-progress-bar');
        
        const polaroids = [
            { el: document.getElementById('pol-1'), triggerAt: 0.12 },
            { el: document.getElementById('pol-2'), triggerAt: 0.35 },
            { el: document.getElementById('pol-3'), triggerAt: 0.58 },
            { el: document.getElementById('pol-4'), triggerAt: 0.80 }
        ];

        const chapters = [
            { title: 'THE BEGINNING', num: 'CHAPTER 01', at: 0.05 },
            { title: 'THE FIRST IDEA', num: 'CHAPTER 02', at: 0.22 },
            { title: 'THE FIRST CLIENT', num: 'CHAPTER 03', at: 0.45 },
            { title: 'THE LATE NIGHTS', num: 'CHAPTER 04', at: 0.68 },
            { title: 'THE FIRST CONVERSATION', num: 'CHAPTER 05', at: 0.88 }
        ];

        let isAnimating = false;
        let pathLength = trackPath.getTotalLength();
        const prefersReducedMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

        const resetTrackDash = () => {
            pathLength = trackPath.getTotalLength();
            activeTrack.style.strokeDasharray = pathLength;
            activeTrack.style.strokeDashoffset = pathLength;
            activeTies.style.strokeDasharray = `5,14`;
            activeTies.style.strokeDashoffset = pathLength;
            trackHighlight.style.strokeDasharray = pathLength;
            trackHighlight.style.strokeDashoffset = pathLength;
        };
        resetTrackDash();

        if (triggerBtn) {
            triggerBtn.addEventListener('click', () => {
                if (isAnimating) return;
                isAnimating = true;

                resetTrackDash();
                document.body.style.overflow = 'hidden';

                overlay.classList.remove('pointer-events-none');
                overlay.classList.add('opacity-100');
                bgVideoContainer.classList.remove('opacity-0');
                bgVideoContainer.classList.add('opacity-100');

                const duration = prefersReducedMotion ? 2000 : 7000;
                let startTime = null;

                trainGroup.setAttribute('opacity', '1');

                function animateFrame(timestamp) {
                    if (!startTime) startTime = timestamp;
                    const elapsed = timestamp - startTime;
                    const progress = Math.min(elapsed / duration, 1);

                    const easeProgress = progress < 0.5 
                        ? 2 * progress * progress 
                        : 1 - Math.pow(-2 * progress + 2, 2) / 2;

                    const currentPointLength = easeProgress * pathLength;
                    const point = trackPath.getPointAtLength(currentPointLength);
                    
                    const aheadPoint = trackPath.getPointAtLength(Math.min(currentPointLength + 2, pathLength));
                    const angle = Math.atan2(aheadPoint.y - point.y, aheadPoint.x - point.x) * (180 / Math.PI);

                    // Position Steam Locomotive (Wheels touch track directly at point.x, point.y)
                    trainGroup.setAttribute('transform', `translate(${point.x}, ${point.y}) rotate(${angle})`);

                    const strokeOffset = pathLength - currentPointLength;
                    activeTrack.style.strokeDashoffset = strokeOffset;
                    activeTies.style.strokeDashoffset = strokeOffset;
                    trackHighlight.style.strokeDashoffset = strokeOffset;

                    progressBar.style.width = `${progress * 100}%`;

                    for (let i = chapters.length - 1; i >= 0; i--) {
                        if (progress >= chapters[i].at) {
                            if (chapterTitle.textContent !== chapters[i].title) {
                                chapterBox.classList.add('opacity-0', 'translate-y-4');
                                setTimeout(() => {
                                    chapterNum.textContent = chapters[i].num;
                                    chapterTitle.textContent = chapters[i].title;
                                    chapterBox.classList.remove('opacity-0', 'translate-y-4');
                                }, 150);
                            }
                            break;
                        }
                    }

                    polaroids.forEach((pol) => {
                        if (progress >= pol.triggerAt) {
                            pol.el.classList.remove('opacity-0', 'translate-y-8');
                            pol.el.classList.add('opacity-100', 'translate-y-0');
                        }
                    });

                    if (Math.random() > 0.35 && progress < 0.95 && !prefersReducedMotion) {
                        createSteamCloud(point.x, point.y, angle, trainSmoke);
                    }

                    if (progress < 1) {
                        requestAnimationFrame(animateFrame);
                    } else {
                        setTimeout(() => {
                            overlay.classList.add('opacity-0');
                            overlay.classList.add('pointer-events-none');
                            document.body.style.overflow = '';

                            const destination = document.getElementById(destinationSectionId);
                            if (destination) {
                                destination.scrollIntoView({ behavior: 'smooth' });
                            }

                            setTimeout(() => {
                                isAnimating = false;
                                resetTrackDash();
                                trainGroup.setAttribute('opacity', '0');
                                polaroids.forEach(p => p.el.classList.add('opacity-0', 'translate-y-8'));
                                progressBar.style.width = '0%';
                            }, 1000);

                        }, 400);
                    }
                }

                requestAnimationFrame(animateFrame);
            });
        }
    }

    function createSteamCloud(trainX, trainY, trainAngle, container) {
        const rad = trainAngle * (Math.PI / 180);
        const chimneyX = trainX + (75 * Math.cos(rad)) - (-48 * Math.sin(rad));
        const chimneyY = trainY + (75 * Math.sin(rad)) + (-48 * Math.cos(rad));

        const circle = document.createElementNS('http://www.w3.org/2000/svg', 'circle');
        circle.setAttribute('cx', chimneyX);
        circle.setAttribute('cy', chimneyY);
        const initialR = Math.random() * 7 + 5;
        circle.setAttribute('r', initialR.toString());
        circle.setAttribute('fill', '#ffffff');
        circle.setAttribute('opacity', '0.5');
        circle.setAttribute('filter', 'blur(3px)');
        container.appendChild(circle);

        let opacity = 0.5;
        let r = initialR;
        let curY = chimneyY;
        let curX = chimneyX;
        
        const anim = setInterval(() => {
            opacity -= 0.015;
            r += 0.85;
            curY -= 1.4;
            curX += (Math.random() - 0.5) * 0.9;
            circle.setAttribute('opacity', Math.max(0, opacity).toString());
            circle.setAttribute('r', r.toString());
            circle.setAttribute('cy', curY.toString());
            circle.setAttribute('cx', curX.toString());

            if (opacity <= 0) {
                clearInterval(anim);
                if (circle.parentNode) circle.parentNode.removeChild(circle);
            }
        }, 30);
    }

    // Initialize on DOM Ready
    document.addEventListener('DOMContentLoaded', () => {
        initJourneyTransition('trigger-journey', 'the-other-narrativ');
    });
</script>
